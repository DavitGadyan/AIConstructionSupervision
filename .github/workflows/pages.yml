# Builds the control.io marketing site (EN/HY/RU + 3D explorer) as static files and publishes it on
# GitHub Pages. The custom domain is set in Settings -> Pages; DNS at Namecheap: CNAME control -> davitgadyan.github.io
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["output/control-io-web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: output/control-io-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: output/control-io-web/package-lock.json
      - run: npm ci
      - name: Build static site
        run: scripts/build-pages.sh
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN || 'control.s1mpleai.org' }}
          # set to the hosted app's URL once the dashboard runs on a server; empty = links go to Contact
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/control-io-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
